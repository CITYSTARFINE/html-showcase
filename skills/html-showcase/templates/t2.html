<!doctype html>
<html lang="zh-CN" data-style="minimal"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>待补充：展示标题</title><link rel="stylesheet" href="../styles/presets.css"><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);background-image:var(--texture);color:var(--text);font-family:var(--font-body)}nav{position:fixed;inset:0 0 auto;z-index:10;display:flex;flex-wrap:wrap;gap:1rem;padding:1rem 5vw;background:var(--surface)}a{color:var(--text);text-decoration:none}a:hover,a[aria-current]{color:var(--accent)}a,button,.card{transition:transform .25s,box-shadow .25s}button{padding:.8rem 1.4rem;border:1px solid var(--accent);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer}button:hover,.card:hover{transform:translateY(-5px);box-shadow:var(--glow)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}#progress{position:fixed;top:0;left:0;height:4px;width:100%;transform:scaleX(0);transform-origin:left;background:var(--accent);z-index:20}section{position:relative;isolation:isolate;min-height:100svh;padding:8rem 8vw 5rem;overflow:hidden}article{max-width:1000px}.js-reveal article{opacity:0;transform:translateY(45px);transition:opacity .8s,transform .8s}.js-reveal section.visible article{opacity:1;transform:none}h1,h2{font:clamp(2.6rem,7vw,6rem)/1.1 var(--font-display);margin:.5em 0}p{color:var(--muted);font-size:1.2rem;line-height:1.8}.eyebrow{color:var(--accent)}.hero{position:relative;padding:2rem;border:1px solid var(--accent);border-radius:var(--radius);background:var(--surface);box-shadow:var(--glow)}.hero strong{display:block;font:clamp(2rem,5vw,4rem)/1.3 var(--font-display);color:var(--accent)}.parallax{position:absolute;z-index:-1;width:45vw;height:45vw;right:-15vw;top:10vh;border:1px solid var(--accent);border-radius:50%;opacity:.18;will-change:transform}.card{padding:1.5rem;border-radius:var(--radius);background:var(--surface);margin-top:1rem}[data-style="chinese"] .eyebrow::after{content:'印';border:2px solid var(--accent);margin-left:1rem;padding:.2rem}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}.js-reveal article{opacity:1;transform:none}.parallax{transform:none!important}}
</style></head><body data-tier="T2"><div id="progress" role="progressbar" aria-label="阅读进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div><nav aria-label="章节导航"><a data-nav href="#intro">开场</a><a data-nav href="#core">核心内容</a><a data-nav href="#end">总结</a></nav><main>

<section id="intro" data-chapter><div class="parallax" aria-hidden="true"></div><article><p class="eyebrow">01 · 开场</p><h1>待补充：展示标题</h1><div class="hero"><strong>待补充：开场视觉重点</strong><p>待补充：一句话引入。</p></div></article></section>
<section id="core" data-chapter><div class="parallax" aria-hidden="true"></div><article><p class="eyebrow">02 · 核心内容</p><h2>待补充：核心观点</h2><div class="hero"><strong>待补充：关键证据</strong><p>待补充：数据来源或案例。</p></div><details class="card"><summary>展开补充材料</summary><p>待补充：支撑材料。</p></details></article></section>
<section id="end" data-chapter><div class="parallax" aria-hidden="true"></div><article><p class="eyebrow">03 · 总结</p><h2>待补充：结论</h2><div class="hero"><strong>待补充：带走的一个观点</strong><p>待补充：下一步。</p><button type="button" onclick="document.querySelector('[data-nav]').click()">回到开场</button></div></article></section></main><script src="../js/nav.js"></script><script>
/* 滚动叙事与视差不引入额外动画库。 */
(() => {const sections=[...document.querySelectorAll('[data-chapter]')];if('IntersectionObserver' in window){document.body.classList.add('js-reveal');const observer=new IntersectionObserver(entries=>entries.forEach(entry=>entry.target.classList.toggle('visible',entry.isIntersecting)),{threshold:.15});sections.forEach(section=>observer.observe(section));}let pending=false;function update(){pending=false;const max=document.documentElement.scrollHeight-innerHeight;const progress=max>0?Math.min(1,Math.max(0,scrollY/max)):1;const bar=document.getElementById('progress');bar.style.transform=`scaleX(${progress})`;bar.setAttribute('aria-valuenow',Math.round(progress*100));if(!matchMedia('(prefers-reduced-motion: reduce)').matches)sections.forEach(section=>section.querySelector('.parallax').style.transform=`translateY(${-section.getBoundingClientRect().top*.12}px)`);}addEventListener('scroll',()=>{if(!pending){pending=true;requestAnimationFrame(update);}},{passive:true});addEventListener('resize',update);update();})();
</script></body></html>
